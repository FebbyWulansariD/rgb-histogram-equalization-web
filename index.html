<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Febby W Damanik - Konvolusi & Histogram Equalization</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    color: #333;
    margin: 0;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h3 {
    color: #2c3e50;
    margin-bottom: 20px;
    font-size: 24px;
}

.container {
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 650px;
}

canvas {
    border: 2px dashed #cbd5e1;
    border-radius: 8px;
    background-color: #f8fafc;
    margin-top: 10px;
    max-width: 100%;
}

input[type="file"] {
    margin: 15px 0;
    padding: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #fff;
    width: 100%;
    box-sizing: border-box;
}

button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: #222222;
    background-color: #f8f9fa;
    border: 1px solid #767676;
    border-radius: 3px;
    padding: 3px 8px;
    margin-top: 6px;
    margin-right: 6px;
    cursor: pointer;
    display: inline-block;
    box-sizing: border-box;
}

button:hover:not(:disabled) {
    background-color: #e8e8e8;
    border-color: #444444;
}

button:active:not(:disabled) {
    background-color: #d0d0d0;
}

button:disabled {
    color: #888888;
    background-color: #f0f0f0;
    border-color: #cccccc;
    cursor: not-allowed;
    opacity: 0.7;
}

input[type="file"] {
    font-family: inherit;
    font-size: 13px;
    color: #333;
    background-color: #f8f9fa;
    border: 1px solid #767676;
    border-radius: 3px;
    padding: 4px;
    margin-top: 8px;
    margin-bottom: 8px;
    cursor: pointer;
}

input[type="file"]::file-selector-button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: #222222;
    background-color: #e9ecef;
    border: 1px solid #ced4da;
    border-radius: 2px;
    padding: 3px 8px;
    margin-right: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
}

input[type="file"]::file-selector-button:hover {
    background-color: #dde2e6;
}

#resolution {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 10px;
    font-weight: 500;
}

.output-section {
    margin-top: 25px;
    border-top: 1px solid #e2e8f0;
    padding-top: 15px;
}

.hist-container {
    display: none;
    margin-top: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
}

th, td {
    border: 1px solid #e2e8f0;
    padding: 6px 8px;
    text-align: center;
}

th {
    background-color: #f1f5f9;
    color: #475569;
}
Keunggulan Styling Ini
</style>
</head>
<body>

<h3>Konvolusi & Histogram Equalization</h3>
<canvas id="gambar" width="300" height="300"></canvas><br>
<input type="file" id="file1" accept=".jpg, .jpeg, .png, .bmp"><br>
<div id="resolution"></div>
<button id="convBtn" onclick="applyConvolution()" disabled>Konvolusi</button>
<button id="histBtn" onclick="histogramEqualizationRGB()" disabled>Histogram Equalization RGB</button>

<div id="channels" class="channel-container"></div>

<div id="histContainer" class="hist-container">
    <div style="display: flex; gap:20px;">
        <div class="hist-section">
            <canvas id="histBefore" width="256" height="100"></canvas>
            <p>Histogram Sebelum</p>
            <div id="tableBefore"></div>
        </div>
        <div class="hist-section">
            <canvas id="histAfter" width="256" height="100"></canvas>
            <p>Histogram Sesudah</p>
            <div id="tableAfter"></div>
        </div>
    </div>
</div>

<script>
let originalImage = null;
let width = 0, height = 0;

document.getElementById("file1").addEventListener("change", function () {
    loadImage(this, "gambar");
});

function loadImage(fileInput, canvasId) {
    const file = fileInput.files[0];
    if (!file) return;

    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    const img = new Image();

    img.onload = function () {
        canvas.width = img.width;
        canvas.height = img.height;
        width = img.width;
        height = img.height;
        ctx.drawImage(img, 0, 0);
        originalImage = img;

        document.getElementById("convBtn").disabled = false;
        document.getElementById("histBtn").disabled = false;
        document.getElementById("resolution").textContent = `Resolution: ${img.width} x ${img.height}`;
    };

    clearChannels();
    document.getElementById("histContainer").style.display = "none";
    img.src = URL.createObjectURL(file);
}

function clearChannels() {
    document.getElementById("channels").innerHTML = "";
}

function createChannelCanvas(label, imgData) {
    const container = document.getElementById("channels");
    const block = document.createElement("div");
    block.className = "channel-block";

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.putImageData(imgData, 0, 0);

    const caption = document.createElement("p");
    caption.textContent = label;

    block.appendChild(canvas);
    block.appendChild(caption);
    container.appendChild(block);
}

function applyConvolution() {
    if (!originalImage) return;
    clearChannels();

    const canvas = document.getElementById("gambar");
    const ctx = canvas.getContext("2d");
    const imgData = ctx.getImageData(0, 0, width, height);

    const kernel = [
        [0, 1, 0],
        [1, 5, 1],
        [0, 1, 0]
    ];
    const kSize = 3;
    const offset = Math.floor(kSize / 2);
    const newImgData = ctx.createImageData(width, height);

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            let r = 0, g = 0, b = 0;
            for (let ky = 0; ky < kSize; ky++) {
                for (let kx = 0; kx < kSize; kx++) {
                    const px = Math.min(width - 1, Math.max(0, x + kx - offset));
                    const py = Math.min(height - 1, Math.max(0, y + ky - offset));
                    const i = (py * width + px) * 4;

                    r += imgData.data[i] * kernel[ky][kx];
                    g += imgData.data[i + 1] * kernel[ky][kx];
                    b += imgData.data[i + 2] * kernel[ky][kx];
                }
            }
            const i = (y * width + x) * 4;
            newImgData.data[i] = Math.min(Math.max(r, 0), 255);
            newImgData.data[i + 1] = Math.min(Math.max(g, 0), 255);
            newImgData.data[i + 2] = Math.min(Math.max(b, 0), 255);
            newImgData.data[i + 3] = 255;
        }
    }
    createChannelCanvas("Konvolusi", newImgData);
}

function histogramEqualizationRGB() {
    if (!originalImage) return;
    clearChannels();

    const canvas = document.getElementById("gambar");
    const ctx = canvas.getContext("2d");
    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;
    const totalPixels = width * height;

    const rChannel = [], gChannel = [], bChannel = [];
    const grayBefore = [];

    for (let i = 0; i < data.length; i += 4) {
        let r = data[i];
        let g = data[i+1];
        let b = data[i+2];

        rChannel.push(r);
        gChannel.push(g);
        bChannel.push(b);

        let gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        grayBefore.push(gray);
    }

    function equalizeChannel(channelData) {
        let hist = new Array(256).fill(0);
        channelData.forEach(v => hist[v]++);

        let cdf = new Array(256).fill(0);
        let sum = 0;
        for (let i = 0; i < 256; i++) {
            sum += hist[i];
            cdf[i] = sum / totalPixels;
        }

        let map = new Array(256);
        for (let i = 0; i < 256; i++) {
            map[i] = Math.round(cdf[i] * 255);
        }

        return channelData.map(v => map[v]);
    }

    const rMapped = equalizeChannel(rChannel);
    const gMapped = equalizeChannel(gChannel);
    const bMapped = equalizeChannel(bChannel);

    const newImgData = ctx.createImageData(width, height);
    let grayAfter = [];

    for (let i = 0; i < totalPixels; i++) {
        let idx = i * 4;
        let rNew = rMapped[i];
        let gNew = gMapped[i];
        let bNew = bMapped[i];

        newImgData.data[idx] = rNew;
        newImgData.data[idx + 1] = gNew;
        newImgData.data[idx + 2] = bNew;
        newImgData.data[idx + 3] = 255;

        let grayA = Math.round(0.299 * rNew + 0.587 * gNew + 0.114 * bNew);
        grayAfter.push(grayA);
    }

    const histBefore = new Array(256).fill(0);
    grayBefore.forEach(v => histBefore[v]++);
    
    const histAfter = new Array(256).fill(0);
    grayAfter.forEach(v => histAfter[v]++);

    document.getElementById("histContainer").style.display = "flex";
    drawHistogram(histBefore, "histBefore");
    drawTable(histBefore, "tableBefore");

    drawHistogram(histAfter, "histAfter");
    drawTable(histAfter, "tableAfter");

    createChannelCanvas("Histogram Equalization RGB", newImgData);
}

function drawHistogram(hist, canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const maxVal = Math.max(...hist);
    for (let i = 0; i < hist.length; i++) {
        const h = maxVal ? (hist[i] / maxVal) * canvas.height : 0;
        ctx.fillStyle = "black";
        ctx.fillRect(i, canvas.height - h, 1, h);
    }
}

function drawTable(hist, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    let table = "<table><tr><th>Pixel</th><th>Freq</th></tr>";
    for (let i = 0; i < hist.length; i++) {
        table += `<tr><td>${i}</td><td>${hist[i]}</td></tr>`;
    }
    table += "</table>";
    container.innerHTML = table;
}
</script>

</body>
</html>
